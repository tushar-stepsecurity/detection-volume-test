# Produces Secret-In-Build-Log and Secret-In-Artifact detections ("Notify when
# secrets are detected in the build log / build artifacts"). The token is a
# fake GitHub PAT built at runtime, so no secret-shaped string is committed.
# The job name carries the run id because the backend notifies once per
# workflow, job and rule; a fixed name would only notify on the first run.
name: secrets-detected

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  leak:
    name: leak-${{ github.run_id }}-${{ github.run_attempt }}
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@rc-20-int
        with:
          egress-policy: audit

      - name: Print a fake token to the build log
        run: |
          token="ghp_$(head -c 200 /dev/urandom | tr -dc 'A-Za-z0-9' | head -c 36)"
          echo "token=${token}"
          echo "${token}" > leaked-token.txt

      - name: Upload the fake token as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: leaked-token-${{ github.run_id }}
          path: leaked-token.txt
          retention-days: 1
